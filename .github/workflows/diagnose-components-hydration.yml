name: Diagnose components hydration

on:
  push:
    branches:
      - fix/components-hydration-blank

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check shared UI
        run: pnpm --filter @pzhown/ui exec tsc -p tsconfig.json --noEmit

      - name: Check Astro
        run: pnpm --filter @pzhown/web check

      - name: Build Astro
        run: pnpm --filter @pzhown/web build

      - name: Install Playwright package for browser verification
        run: pnpm add -Dw playwright@latest --ignore-workspace-root-check

      - name: Start production preview and dev server
        run: |
          pnpm --filter @pzhown/web preview --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          pnpm --filter @pzhown/web dev --host 127.0.0.1 --port 4322 > /tmp/astro-dev.log 2>&1 &
          for port in 4321 4322; do
            ready=0
            for i in $(seq 1 90); do
              if curl -fsS "http://127.0.0.1:${port}/components/" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Server ${port} failed to start"
              cat /tmp/astro-preview.log || true
              cat /tmp/astro-dev.log || true
              exit 1
            fi
          done

      - name: Capture production and development browser diagnostics
        run: |
          node <<'NODE'
          const { chromium } = require('playwright')

          async function inspect(browser, label, url) {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } })
            const pageErrors = []
            const consoleMessages = []
            const failedResources = []
            const requestFailures = []

            page.on('pageerror', error => pageErrors.push(error.stack || error.message))
            page.on('console', message => {
              if (message.type() === 'error' || message.type() === 'warning') {
                consoleMessages.push(`${message.type().toUpperCase()}: ${message.text()}`)
              }
            })
            page.on('response', response => {
              if (response.status() >= 400) failedResources.push(`${response.status()} ${response.url()}`)
            })
            page.on('requestfailed', request => {
              requestFailures.push(`${request.failure()?.errorText || 'FAILED'} ${request.url()}`)
            })

            await page.goto(url, { waitUntil: 'networkidle' })
            await page.waitForTimeout(2000)

            const state = await page.evaluate(() => ({
              root: Boolean(document.querySelector('.component-document')),
              cards: document.querySelectorAll('[data-component]').length,
              text: document.body.innerText.length,
              demoErrors: Array.from(document.querySelectorAll('[data-demo-error]')).map(node => node.getAttribute('data-demo-error')),
            }))

            console.log(`=== ${label} ===`)
            console.log('PAGE STATE', JSON.stringify(state))
            console.log('FAILED RESOURCES', JSON.stringify(failedResources))
            console.log('REQUEST FAILURES', JSON.stringify(requestFailures))
            console.log('PAGE ERRORS', JSON.stringify(pageErrors))
            console.log('CONSOLE MESSAGES', JSON.stringify(consoleMessages))
            await page.close()
            return { state, pageErrors, consoleMessages, failedResources, requestFailures }
          }

          ;(async () => {
            const browser = await chromium.launch({ channel: 'chrome', headless: true })
            const production = await inspect(browser, 'PRODUCTION', 'http://127.0.0.1:4321/components/')
            const development = await inspect(browser, 'DEVELOPMENT', 'http://127.0.0.1:4322/components/')
            await browser.close()

            for (const result of [production, development]) {
              if (!result.state.root || result.state.cards !== 58 || result.state.demoErrors.length) {
                process.exit(1)
              }
            }
          })().catch(error => {
            console.error(error)
            process.exit(1)
          })
          NODE
