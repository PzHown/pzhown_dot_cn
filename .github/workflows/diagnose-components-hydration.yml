name: Diagnose components hydration

on:
  push:
    branches:
      - fix/components-hydration-blank

permissions:
  contents: write

jobs:
  browser:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair component document hydration failures
        run: |
          node <<'NODE'
          const fs = require('fs')

          function replace(path, from, to, label) {
            let source = fs.readFileSync(path, 'utf8')
            if (!source.includes(from)) throw new Error(`Patch target not found: ${label}`)
            source = source.replace(from, to)
            fs.writeFileSync(path, source)
          }

          const demos = 'apps/web/src/components/component-document/ComponentDemos.tsx'

          replace(
            demos,
            '<Piece name="AvatarImage" src="/favicon.svg" alt="PzHown" />',
            '<Piece name="AvatarImage" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2264%22 height=%2264%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2218%22 fill=%22%2312171f%22/%3E%3Ctext x=%2232%22 y=%2240%22 text-anchor=%22middle%22 font-size=%2222%22 font-family=%22sans-serif%22 fill=%22white%22%3EPH%3C/text%3E%3C/svg%3E" alt="PzHown" />',
            'avatar inline image'
          )

          replace(
            demos,
            `function BreadcrumbDemo() {\n  return (\n    <Piece name="Breadcrumb">\n      <Piece name="BreadcrumbList">\n        <Piece name="BreadcrumbItem"><Piece name="BreadcrumbLink" href="#breadcrumb">首页</Piece></Piece>\n        <Piece name="BreadcrumbSeparator" />\n        <Piece name="BreadcrumbItem"><Piece name="BreadcrumbLink" href="#breadcrumb">设计系统</Piece></Piece>\n        <Piece name="BreadcrumbSeparator" />\n        <Piece name="BreadcrumbItem"><Piece name="BreadcrumbEllipsis" /></Piece>\n        <Piece name="BreadcrumbSeparator" />\n        <Piece name="BreadcrumbItem"><Piece name="BreadcrumbPage">组件文档</Piece></Piece>\n      </Piece>\n    </Piece>\n  )\n}`,
            `function BreadcrumbDemo() {\n  return (\n    <Piece name="Breadcrumb">\n      <Piece name="BreadcrumbList">\n        <Piece name="BreadcrumbItem"><Piece name="BreadcrumbLink" href="#breadcrumb">首页</Piece></Piece>\n        <Piece name="BreadcrumbItem"><Piece name="BreadcrumbLink" href="#breadcrumb">设计系统</Piece></Piece>\n        <Piece name="BreadcrumbItem"><Piece name="BreadcrumbEllipsis" /></Piece>\n        <Piece name="BreadcrumbItem"><Piece name="BreadcrumbPage">组件文档</Piece></Piece>\n      </Piece>\n    </Piece>\n  )\n}`,
            'breadcrumb automatic separators'
          )

          replace(
            demos,
            `function TableDemo() {\n  return (\n    <Piece name="Table" aria-label="组件状态表">\n      <Piece name="TableHeader">\n        <Piece name="TableHead" id="component">组件</Piece>\n        <Piece name="TableHead" id="state">状态</Piece>\n        <Piece name="TableHead" id="note">备注</Piece>\n      </Piece>\n      <Piece name="TableBody">\n        <Piece name="TableRow" id="button"><Piece name="TableCell">Button</Piece><Piece name="TableCell">Default</Piece><Piece name="TableCell">普通行</Piece></Piece>\n        <Piece name="TableRow" id="switch" data-state="selected"><Piece name="TableCell">Switch</Piece><Piece name="TableCell">Selected</Piece><Piece name="TableCell">选中行</Piece></Piece>\n        <Piece name="TableRow" id="input"><Piece name="TableCell">Input</Piece><Piece name="TableCell">Invalid</Piece><Piece name="TableCell">悬停检查</Piece></Piece>\n      </Piece>\n      <Piece name="TableCaption">组件状态表</Piece>\n    </Piece>\n  )\n}`,
            `function TableDemo() {\n  return (\n    <DemoStack>\n      <Piece name="Table" aria-label="组件状态表">\n        <Piece name="TableHeader">\n          <Piece name="TableHead" id="component">组件</Piece>\n          <Piece name="TableHead" id="state">状态</Piece>\n          <Piece name="TableHead" id="note">备注</Piece>\n        </Piece>\n        <Piece name="TableBody">\n          <Piece name="TableRow" id="button"><Piece name="TableCell">Button</Piece><Piece name="TableCell">Default</Piece><Piece name="TableCell">普通行</Piece></Piece>\n          <Piece name="TableRow" id="switch" data-state="selected"><Piece name="TableCell">Switch</Piece><Piece name="TableCell">Selected</Piece><Piece name="TableCell">选中行</Piece></Piece>\n          <Piece name="TableRow" id="input"><Piece name="TableCell">Input</Piece><Piece name="TableCell">Invalid</Piece><Piece name="TableCell">悬停检查</Piece></Piece>\n        </Piece>\n      </Piece>\n      <Piece name="TableCaption">组件状态表</Piece>\n    </DemoStack>\n  )\n}`,
            'table caption outside React Aria collection'
          )

          const documentPath = 'apps/web/src/components/component-document/ComponentsDocument.tsx'
          let documentSource = fs.readFileSync(documentPath, 'utf8')
          const boundaryAnchor = `function ComponentCard({ id }: { id: string }) {`
          const boundary = `type DemoErrorBoundaryProps = {\n  componentId: string\n  children: React.ReactNode\n}\n\ntype DemoErrorBoundaryState = {\n  error: Error | null\n}\n\nclass DemoErrorBoundary extends React.Component<DemoErrorBoundaryProps, DemoErrorBoundaryState> {\n  state: DemoErrorBoundaryState = { error: null }\n\n  static getDerivedStateFromError(error: Error): DemoErrorBoundaryState {\n    return { error }\n  }\n\n  componentDidCatch(error: Error) {\n    console.error(\`[component-document:\${this.props.componentId}]\`, error)\n  }\n\n  componentDidUpdate(previousProps: DemoErrorBoundaryProps) {\n    if (previousProps.componentId !== this.props.componentId && this.state.error) {\n      this.setState({ error: null })\n    }\n  }\n\n  render() {\n    if (this.state.error) {\n      return (\n        <div role="alert" className="tw:rounded-xl tw:border tw:border-destructive/30 tw:bg-destructive/8 tw:p-4">\n          <strong className="tw:block tw:text-sm tw:text-destructive">该组件 Demo 运行失败</strong>\n          <p className="tw:mt-1 tw:mb-0 tw:text-xs tw:leading-5 tw:text-muted-foreground">\n            已隔离错误，不会影响其他组件。请查看控制台中的 component-document 日志。\n          </p>\n        </div>\n      )\n    }\n\n    return this.props.children\n  }\n}\n\nfunction ComponentCard({ id }: { id: string }) {`
          if (!documentSource.includes(boundaryAnchor)) throw new Error('ErrorBoundary anchor not found')
          documentSource = documentSource.replace(boundaryAnchor, boundary)
          const demoTarget = `{Demo ? <Demo /> : <p className="tw:text-sm tw:text-destructive">此组件尚未建立 Demo。</p>}`
          const demoReplacement = `{Demo ? (\n              <DemoErrorBoundary componentId={doc.id}>\n                <Demo />\n              </DemoErrorBoundary>\n            ) : (\n              <p className="tw:text-sm tw:text-destructive">此组件尚未建立 Demo。</p>\n            )}`
          if (!documentSource.includes(demoTarget)) throw new Error('Demo boundary target not found')
          documentSource = documentSource.replace(demoTarget, demoReplacement)
          fs.writeFileSync(documentPath, documentSource)

          const catalog = 'apps/web/src/components/component-document/catalog.ts'
          let catalogSource = fs.readFileSync(catalog, 'utf8')
          catalogSource = catalogSource.replace(
            "composition: ['Breadcrumb', '└─ BreadcrumbList', '   ├─ BreadcrumbItem', '   │  ├─ BreadcrumbLink', '   │  └─ BreadcrumbPage', '   ├─ BreadcrumbSeparator', '   └─ BreadcrumbEllipsis'],",
            "composition: ['Breadcrumb', '└─ BreadcrumbList', '   └─ BreadcrumbItem × n', '      ├─ BreadcrumbLink / BreadcrumbPage / BreadcrumbEllipsis', '      └─ separator 由 BreadcrumbItem 自动生成'],"
          )
          catalogSource = catalogSource.replace(
            "composition: ['Table', '├─ TableHeader', '│  └─ TableRow / TableHead', '├─ TableBody', '│  └─ TableRow / TableCell', '└─ TableFooter / TableCaption'],",
            "composition: ['Table', '├─ TableHeader', '│  └─ TableHead', '├─ TableBody', '│  └─ TableRow / TableCell', '└─ TableFooter', 'TableCaption · 作为 Table 的兄弟节点'],"
          )
          fs.writeFileSync(catalog, catalogSource)
          NODE

      - name: Commit hydration fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/components/component-document
          git commit -m 'fix(web): keep component document stable during hydration'
          git push origin HEAD:fix/components-hydration-blank

      - name: Check shared UI
        run: pnpm --filter @pzhown/ui exec tsc -p tsconfig.json --noEmit

      - name: Check Astro
        run: pnpm --filter @pzhown/web check

      - name: Build Astro
        run: pnpm --filter @pzhown/web build

      - name: Install Playwright package for browser verification
        run: pnpm add -Dw playwright@latest --ignore-workspace-root-check

      - name: Start production preview
        run: |
          pnpm --filter @pzhown/web preview --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          echo $! > /tmp/astro-preview.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4321/components/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/astro-preview.log
          exit 1

      - name: Verify all 58 components hydrate in Chrome
        run: |
          node <<'NODE'
          const { chromium } = require('playwright')

          ;(async () => {
            const browser = await chromium.launch({ channel: 'chrome', headless: true })
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } })
            const pageErrors = []
            const consoleErrors = []
            const warnings = []

            page.on('pageerror', error => pageErrors.push(error.stack || error.message))
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text())
              if (message.type() === 'warning') warnings.push(message.text())
            })

            const response = await page.goto('http://127.0.0.1:4321/components/', { waitUntil: 'networkidle' })
            await page.waitForTimeout(2000)
            const state = await page.evaluate(() => ({
              root: Boolean(document.querySelector('.component-document')),
              cards: document.querySelectorAll('[data-component]').length,
              demoFailures: document.querySelectorAll('[role="alert"]').length,
              text: document.body.innerText.length,
            }))

            console.log('HTTP', response && response.status())
            console.log('PAGE STATE', JSON.stringify(state))
            for (const warning of warnings) console.log('WARNING', warning)
            for (const error of pageErrors) console.error('PAGEERROR', error)
            for (const error of consoleErrors) console.error('CONSOLE ERROR', error)

            await browser.close()

            if (!state.root || state.cards !== 58 || state.demoFailures || state.text < 5000 || pageErrors.length || consoleErrors.length) {
              process.exit(1)
            }
          })().catch(error => {
            console.error(error)
            process.exit(1)
          })
          NODE
