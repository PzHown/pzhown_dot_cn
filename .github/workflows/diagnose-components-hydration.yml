name: Diagnose components hydration

on:
  push:
    branches:
      - fix/components-hydration-blank

permissions:
  contents: read

jobs:
  input-warning:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - field
          - input
          - input-group
          - input-otp
          - native-select
          - questionnaire
          - radio-group
          - slider
          - tabs
          - textarea
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render only candidate demo
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'apps/web/src/components/component-document/ComponentsDocument.tsx'
          const target = process.env.TARGET
          let source = fs.readFileSync(path, 'utf8')
          const begin = source.indexOf('  const filtered = normalized\n')
          const finish = source.indexOf('\n\n  return (', begin)
          if (begin < 0 || finish < 0) throw new Error('filtered block not found')
          source = source.slice(0, begin) + `  const filtered = componentDocs.filter((item) => item.id === '${target}')` + source.slice(finish)
          fs.writeFileSync(path, source)
          NODE

      - name: Install Playwright package
        run: pnpm add -Dw playwright@latest --ignore-workspace-root-check

      - name: Start Astro dev server
        run: |
          pnpm --filter @pzhown/web dev --host 127.0.0.1 --port 4322 > /tmp/astro-dev.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4322/components/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/astro-dev.log
          exit 1

      - name: Inspect candidate console
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright')

          ;(async () => {
            const browser = await chromium.launch({ channel: 'chrome', headless: true })
            const page = await browser.newPage()
            const messages = []
            const pageErrors = []

            page.on('pageerror', error => pageErrors.push(error.stack || error.message))
            page.on('console', message => {
              if (message.type() === 'error' || message.type() === 'warning') {
                messages.push(`${message.type()}: ${message.text()}`)
              }
            })

            await page.goto('http://127.0.0.1:4322/components/', { waitUntil: 'networkidle' })
            await page.waitForTimeout(1200)

            const cards = await page.locator('[data-component]').evaluateAll(nodes => nodes.map(node => node.getAttribute('data-component')))
            console.log('TARGET', process.env.TARGET)
            console.log('CARDS', JSON.stringify(cards))
            console.log('PAGE ERRORS', JSON.stringify(pageErrors))
            console.log('MESSAGES', JSON.stringify(messages))

            await browser.close()

            if (cards.length !== 1 || cards[0] !== process.env.TARGET || pageErrors.length) process.exit(2)
            if (messages.some(message => message.includes('both value and defaultValue'))) process.exit(1)
          })().catch(error => {
            console.error(error)
            process.exit(2)
          })
          NODE
