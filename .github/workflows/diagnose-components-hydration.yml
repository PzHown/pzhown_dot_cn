name: Diagnose components hydration

on:
  push:
    branches:
      - fix/components-hydration-blank

permissions:
  contents: read

jobs:
  warning-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare client-only single-component diagnostic mode
        run: |
          node <<'NODE'
          const fs = require('fs')

          const componentPath = 'apps/web/src/components/component-document/ComponentsDocument.tsx'
          let componentSource = fs.readFileSync(componentPath, 'utf8')
          const marker = "  const normalized = query.trim().toLowerCase()\n\n  const filtered = normalized\n"
          if (!componentSource.includes(marker)) throw new Error('ComponentsDocument filter marker not found')
          componentSource = componentSource.replace(
            marker,
            "  const normalized = query.trim().toLowerCase()\n  const diagnosticTarget = typeof window === 'undefined' ? '' : new URLSearchParams(window.location.search).get('component') ?? ''\n\n  const filtered = diagnosticTarget\n    ? componentDocs.filter((item) => item.id === diagnosticTarget)\n    : normalized\n"
          )
          fs.writeFileSync(componentPath, componentSource)

          const pagePath = 'apps/web/src/pages/components.astro'
          let pageSource = fs.readFileSync(pagePath, 'utf8')
          if (!pageSource.includes('<ComponentsDocument client:load />')) throw new Error('components.astro client directive not found')
          pageSource = pageSource.replace('<ComponentsDocument client:load />', '<ComponentsDocument client:only="react" />')
          fs.writeFileSync(pagePath, pageSource)
          NODE

      - name: Install Playwright package
        run: pnpm add -Dw playwright@latest --ignore-workspace-root-check

      - name: Start Astro dev server
        run: |
          pnpm --filter @pzhown/web dev --host 127.0.0.1 --port 4322 > /tmp/astro-dev.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4322/components/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/astro-dev.log
          exit 1

      - name: Scan all component demos for remaining warnings
        run: |
          node <<'NODE'
          const fs = require('fs')
          const { chromium } = require('playwright')

          const catalog = fs.readFileSync('apps/web/src/components/component-document/catalog.ts', 'utf8')
          const ids = [...catalog.matchAll(/\bid:\s*'([^']+)'/g)].map((match) => match[1])
          if (ids.length !== 58) throw new Error(`Expected 58 component ids, found ${ids.length}`)

          ;(async () => {
            const browser = await chromium.launch({ channel: 'chrome', headless: true })
            const offenders = []

            for (const id of ids) {
              const page = await browser.newPage({ viewport: { width: 1280, height: 900 } })
              const messages = []
              const pageErrors = []

              page.on('pageerror', error => pageErrors.push(error.stack || error.message))
              page.on('console', message => {
                if (message.type() === 'error' || message.type() === 'warning') {
                  messages.push(`${message.type()}: ${message.text()}`)
                }
              })

              await page.goto(`http://127.0.0.1:4322/components/?component=${encodeURIComponent(id)}`, { waitUntil: 'networkidle' })
              await page.waitForTimeout(350)

              const state = await page.evaluate(() => ({
                cards: Array.from(document.querySelectorAll('[data-component]')).map((node) => node.getAttribute('data-component')),
                demoErrors: Array.from(document.querySelectorAll('[data-demo-error]')).map((node) => node.getAttribute('data-demo-error')),
              }))

              if (state.cards.length !== 1 || state.cards[0] !== id || state.demoErrors.length || pageErrors.length) {
                console.log('DIAGNOSTIC FAILURE', id, JSON.stringify({ state, pageErrors, messages }))
                await browser.close()
                process.exit(2)
              }

              const relevant = messages.filter((message) =>
                message.includes('If you do not provide a visible label') ||
                message.includes('PressResponder was rendered without a pressable child')
              )

              if (relevant.length) {
                offenders.push({ id, messages: relevant })
                console.log('OFFENDER', id, JSON.stringify(relevant))
              }

              await page.close()
            }

            await browser.close()
            console.log('OFFENDERS', JSON.stringify(offenders))
            console.log('SCANNED', ids.length)
          })().catch((error) => {
            console.error(error)
            process.exit(2)
          })
          NODE
