name: Diagnose components hydration

on:
  push:
    branches:
      - fix/components-hydration-blank

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check shared UI
        run: pnpm --filter @pzhown/ui exec tsc -p tsconfig.json --noEmit

      - name: Check Astro
        run: pnpm --filter @pzhown/web check

      - name: Build Astro
        run: pnpm --filter @pzhown/web build

      - name: Install Playwright package for browser verification
        run: pnpm add -Dw playwright@latest --ignore-workspace-root-check

      - name: Start production preview
        run: |
          pnpm --filter @pzhown/web preview --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4321/components/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/astro-preview.log
          exit 1

      - name: Identify remaining browser failures
        run: |
          node <<'NODE'
          const { chromium } = require('playwright')

          ;(async () => {
            const browser = await chromium.launch({ channel: 'chrome', headless: true })
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } })
            const pageErrors = []
            const consoleMessages = []
            const failedResources = []

            page.on('pageerror', error => pageErrors.push(error.stack || error.message))
            page.on('console', message => {
              if (message.type() === 'error' || message.type() === 'warning') {
                consoleMessages.push(`${message.type().toUpperCase()}: ${message.text()}`)
              }
            })
            page.on('response', response => {
              if (response.status() >= 400) failedResources.push(`${response.status()} ${response.url()}`)
            })

            await page.goto('http://127.0.0.1:4321/components/', { waitUntil: 'networkidle' })
            await page.waitForTimeout(2000)

            const state = await page.evaluate(() => ({
              root: Boolean(document.querySelector('.component-document')),
              cards: document.querySelectorAll('[data-component]').length,
              text: document.body.innerText.length,
              failureIds: Array.from(document.querySelectorAll('[role="alert"]'))
                .map(node => node.closest('[data-component]')?.getAttribute('data-component'))
                .filter(Boolean),
            }))

            console.log('PAGE STATE', JSON.stringify(state))
            console.log('FAILED RESOURCES', JSON.stringify(failedResources))
            console.log('PAGE ERRORS', JSON.stringify(pageErrors))
            console.log('CONSOLE MESSAGES', JSON.stringify(consoleMessages))
            await browser.close()

            if (!state.root || state.cards !== 58) process.exit(1)
          })().catch(error => {
            console.error(error)
            process.exit(1)
          })
          NODE
