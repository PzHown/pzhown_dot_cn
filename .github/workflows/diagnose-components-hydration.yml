name: Diagnose components hydration

on:
  push:
    branches:
      - fix/components-hydration-blank

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render only the Table document entry
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'apps/web/src/components/component-document/ComponentsDocument.tsx'
          let source = fs.readFileSync(path, 'utf8')
          const begin = source.indexOf('  const filtered = normalized\n')
          const finish = source.indexOf('\n\n  return (', begin)
          if (begin < 0 || finish < 0) throw new Error('filtered block not found')
          source = source.slice(0, begin) + '  const filtered = componentDocs.filter((item) => item.id === \'table\')' + source.slice(finish)
          fs.writeFileSync(path, source)
          NODE

      - name: Check Astro
        run: pnpm --filter @pzhown/web check

      - name: Build Astro
        run: pnpm --filter @pzhown/web build

      - name: Install Playwright package
        run: pnpm add -Dw playwright@latest --ignore-workspace-root-check

      - name: Start production preview and dev server
        run: |
          pnpm --filter @pzhown/web preview --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          pnpm --filter @pzhown/web dev --host 127.0.0.1 --port 4322 > /tmp/astro-dev.log 2>&1 &
          for port in 4321 4322; do
            for i in $(seq 1 90); do
              if curl -fsS "http://127.0.0.1:${port}/components/" >/dev/null; then
                break
              fi
              sleep 1
            done
          done

      - name: Verify isolated Table hydration
        run: |
          node <<'NODE'
          const { chromium } = require('playwright')
          async function inspect(browser, label, url) {
            const page = await browser.newPage()
            const pageErrors = []
            const messages = []
            page.on('pageerror', error => pageErrors.push(error.stack || error.message))
            page.on('console', message => {
              if (message.type() === 'error' || message.type() === 'warning') messages.push(`${message.type()}: ${message.text()}`)
            })
            await page.goto(url, { waitUntil: 'networkidle' })
            await page.waitForTimeout(1500)
            const state = await page.evaluate(() => ({
              root: Boolean(document.querySelector('.component-document')),
              cards: Array.from(document.querySelectorAll('[data-component]')).map(node => node.getAttribute('data-component')),
              demoErrors: Array.from(document.querySelectorAll('[data-demo-error]')).map(node => node.getAttribute('data-demo-error')),
            }))
            console.log(`=== ${label} ===`)
            console.log('STATE', JSON.stringify(state))
            console.log('PAGE ERRORS', JSON.stringify(pageErrors))
            console.log('MESSAGES', JSON.stringify(messages))
            await page.close()
          }
          ;(async () => {
            const browser = await chromium.launch({ channel: 'chrome', headless: true })
            await inspect(browser, 'PRODUCTION TABLE', 'http://127.0.0.1:4321/components/')
            await inspect(browser, 'DEVELOPMENT TABLE', 'http://127.0.0.1:4322/components/')
            await browser.close()
          })().catch(error => { console.error(error); process.exit(1) })
          NODE
