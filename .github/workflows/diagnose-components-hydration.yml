name: Diagnose components hydration

on:
  push:
    branches:
      - fix/components-hydration-blank

permissions:
  contents: write

jobs:
  browser:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use a React Aria pressable for the context-menu target
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'apps/web/src/components/component-document/ComponentDemos.tsx'
          let source = fs.readFileSync(path, 'utf8')
          const from = `<button type="button" className="tw:grid tw:h-28 tw:w-full tw:place-items-center tw:rounded-xl tw:border tw:border-dashed tw:border-border tw:bg-muted/50 tw:text-sm tw:text-muted-foreground">在这里右键</button>`
          const to = `<Piece name="Button" variant="outline" className="tw:grid tw:h-28 tw:w-full tw:place-items-center tw:rounded-xl tw:border-dashed tw:bg-muted/50 tw:text-sm tw:font-normal tw:text-muted-foreground">在这里右键</Piece>`
          if (!source.includes(from)) throw new Error('ContextMenu pressable target not found')
          source = source.replace(from, to)
          fs.writeFileSync(path, source)
          NODE

      - name: Commit context-menu fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/components/component-document/ComponentDemos.tsx
          git commit -m 'fix(web): use pressable context menu trigger'
          git push origin HEAD:fix/components-hydration-blank

      - name: Check shared UI
        run: pnpm --filter @pzhown/ui exec tsc -p tsconfig.json --noEmit

      - name: Check Astro
        run: pnpm --filter @pzhown/web check

      - name: Build Astro
        run: pnpm --filter @pzhown/web build

      - name: Install Playwright package
        run: pnpm add -Dw playwright@latest --ignore-workspace-root-check

      - name: Start production preview and dev server
        run: |
          pnpm --filter @pzhown/web preview --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          pnpm --filter @pzhown/web dev --host 127.0.0.1 --port 4322 > /tmp/astro-dev.log 2>&1 &
          for port in 4321 4322; do
            ready=0
            for i in $(seq 1 90); do
              if curl -fsS "http://127.0.0.1:${port}/components/" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              cat /tmp/astro-preview.log || true
              cat /tmp/astro-dev.log || true
              exit 1
            fi
          done

      - name: Require clean full browser console
        run: |
          node <<'NODE'
          const { chromium } = require('playwright')

          async function inspect(browser, label, url) {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } })
            const pageErrors = []
            const messages = []
            const failedResponses = []

            page.on('pageerror', error => pageErrors.push(error.stack || error.message))
            page.on('console', message => {
              if (message.type() === 'error' || message.type() === 'warning') {
                messages.push(`${message.type()}: ${message.text()}`)
              }
            })
            page.on('response', response => {
              if (response.status() >= 400) failedResponses.push(`${response.status()} ${response.url()}`)
            })

            await page.goto(url, { waitUntil: 'networkidle' })
            await page.waitForTimeout(2000)

            const state = await page.evaluate(() => ({
              root: Boolean(document.querySelector('.component-document')),
              cards: document.querySelectorAll('[data-component]').length,
              demoErrors: Array.from(document.querySelectorAll('[data-demo-error]')).map(node => node.getAttribute('data-demo-error')),
              tableRendered: Boolean(document.querySelector('[data-component="table"] [data-slot="table"]')),
              text: document.body.innerText.length,
            }))

            console.log(`=== ${label} ===`)
            console.log('STATE', JSON.stringify(state))
            console.log('PAGE ERRORS', JSON.stringify(pageErrors))
            console.log('MESSAGES', JSON.stringify(messages))
            console.log('FAILED RESPONSES', JSON.stringify(failedResponses))
            await page.close()

            return { state, pageErrors, messages, failedResponses }
          }

          ;(async () => {
            const browser = await chromium.launch({ channel: 'chrome', headless: true })
            const production = await inspect(browser, 'PRODUCTION', 'http://127.0.0.1:4321/components/')
            const development = await inspect(browser, 'DEVELOPMENT', 'http://127.0.0.1:4322/components/')
            await browser.close()

            for (const result of [production, development]) {
              if (
                !result.state.root ||
                result.state.cards !== 58 ||
                result.state.demoErrors.length ||
                !result.state.tableRendered ||
                result.pageErrors.length ||
                result.messages.length ||
                result.failedResponses.length
              ) {
                process.exit(1)
              }
            }
          })().catch(error => {
            console.error(error)
            process.exit(1)
          })
          NODE
