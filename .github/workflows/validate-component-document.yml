name: Validate full Astro component document

on:
  push:
    branches:
      - feat/astro-full-component-lab

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check shared UI
        run: pnpm --filter @pzhown/ui exec tsc -p tsconfig.json --noEmit

      - name: Check Astro
        run: pnpm --filter @pzhown/web check

      - name: Add temporary SSR component trace
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'apps/web/src/components/component-document/ComponentsDocument.tsx'
          let source = fs.readFileSync(path, 'utf8')
          const target = `  const Demo = componentDemos[id]\n\n  return (`
          if (!source.includes(target)) throw new Error('SSR trace insertion target not found')
          source = source.replace(target, `  const Demo = componentDemos[id]\n  console.log('[component-document:ssr]', id)\n\n  return (`)
          fs.writeFileSync(path, source)
          NODE

      - name: Build Astro with trace
        run: pnpm --filter @pzhown/web build
