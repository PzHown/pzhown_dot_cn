name: Enforce ThemeProvider-owned iOS materials

on:
  push:
    branches:
      - refactor/ios-theme-provider

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Replay ThemeProvider refactor
        run: |
          node <<'EXTRACT'
          const fs = require('fs')
          const source = fs.readFileSync('.github/workflows/ios-theme-provider.yml', 'utf8')
          const marker = "          node <<'NODE'\n"
          const start = source.indexOf(marker)
          if (start < 0) throw new Error('Original ThemeProvider transform not found')
          const bodyStart = start + marker.length
          const end = source.indexOf('\n          NODE', bodyStart)
          if (end < 0) throw new Error('Original ThemeProvider transform end not found')
          const script = source.slice(bodyStart, end).replace(/^          /gm, '')
          fs.writeFileSync('/tmp/apply-ios-theme.js', script)
          EXTRACT
          node /tmp/apply-ios-theme.js

      - name: Make material filters ThemeProvider-owned
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'packages/ui/src/components.css'
          let css = fs.readFileSync(path, 'utf8')

          css = css.replace(
            "  --pzhown-ui-overlay-scrim: oklch(0.08 0.006 260 / 0.24);",
            "  --pzhown-ui-overlay-scrim: oklch(0.08 0.006 260 / 0.24);\n  --pzhown-ui-material-filter: blur(28px) saturate(1.35);\n  --pzhown-ui-scrim-filter: blur(8px) saturate(1.05);\n  --pzhown-ui-tooltip-filter: blur(14px) saturate(1.2);"
          )
          css = css.replace(
            "  --pzhown-ui-overlay-scrim: oklch(0.015 0.003 260 / 0.58);",
            "  --pzhown-ui-overlay-scrim: oklch(0.015 0.003 260 / 0.58);\n  --pzhown-ui-material-filter: blur(28px) saturate(1.35);\n  --pzhown-ui-scrim-filter: blur(8px) saturate(1.05);\n  --pzhown-ui-tooltip-filter: blur(14px) saturate(1.2);"
          )

          const marker = '/* -------------------------------------------------------------------------- */\n/* Motion and input adaptation'
          const index = css.indexOf(marker)
          if (index < 0) throw new Error('Motion marker not found')

          const materialBlock = `/* -------------------------------------------------------------------------- */
/* Theme-owned iOS materials                                                   */
/* -------------------------------------------------------------------------- */

[data-pzhown-ui][data-pzhown-theme='ios'] :is(
  .pzhown-dialog-overlay,
  [data-slot='alert-dialog-overlay'],
  [data-slot='drawer-overlay'],
  [data-slot='sheet-overlay']
) {
  backdrop-filter: var(--pzhown-ui-scrim-filter) !important;
  -webkit-backdrop-filter: var(--pzhown-ui-scrim-filter) !important;
}

[data-pzhown-ui][data-pzhown-theme='ios'] :is(
  .pzhown-dialog-content,
  .pzhown-popover-content,
  .pzhown-dropdown-content,
  [data-slot='alert-dialog-content'],
  [data-slot='drawer-popup'],
  [data-slot='sheet-content'],
  [data-slot='select-content'],
  [data-slot='combobox-content'],
  [data-slot='hover-card-content'],
  [data-slot='context-menu-content'],
  [data-slot='context-menu-sub-content']
) {
  background: var(--pzhown-ui-surface-elevated) !important;
  backdrop-filter: var(--pzhown-ui-material-filter) !important;
  -webkit-backdrop-filter: var(--pzhown-ui-material-filter) !important;
}

[data-pzhown-ui][data-pzhown-theme='ios'] :is(
  .pzhown-tooltip-content,
  [data-slot='tooltip-content']
) {
  background: var(--pzhown-ui-tooltip-background) !important;
  color: var(--pzhown-ui-tooltip-foreground) !important;
  backdrop-filter: var(--pzhown-ui-tooltip-filter) !important;
  -webkit-backdrop-filter: var(--pzhown-ui-tooltip-filter) !important;
}

@media (prefers-reduced-transparency: reduce) {
  [data-pzhown-ui][data-pzhown-theme='ios'] :is(
    .pzhown-dialog-overlay,
    [data-slot='alert-dialog-overlay'],
    [data-slot='drawer-overlay'],
    [data-slot='sheet-overlay'],
    .pzhown-dialog-content,
    .pzhown-popover-content,
    .pzhown-dropdown-content,
    [data-slot='alert-dialog-content'],
    [data-slot='drawer-popup'],
    [data-slot='sheet-content'],
    [data-slot='select-content'],
    [data-slot='combobox-content'],
    [data-slot='hover-card-content'],
    [data-slot='context-menu-content'],
    [data-slot='context-menu-sub-content'],
    .pzhown-tooltip-content,
    [data-slot='tooltip-content']
  ) {
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
  }

  [data-pzhown-ui][data-pzhown-theme='ios'] :is(
    .pzhown-dialog-content,
    .pzhown-popover-content,
    .pzhown-dropdown-content,
    [data-slot='alert-dialog-content'],
    [data-slot='drawer-popup'],
    [data-slot='sheet-content'],
    [data-slot='select-content'],
    [data-slot='combobox-content'],
    [data-slot='hover-card-content'],
    [data-slot='context-menu-content'],
    [data-slot='context-menu-sub-content']
  ) {
    background: var(--pzhown-ui-surface-1) !important;
  }
}

`
          css = css.slice(0, index) + materialBlock + css.slice(index)
          fs.writeFileSync(path, css)
          NODE

      - name: Validate ownership and builds
        run: |
          grep -q "export function ThemeProvider" packages/ui/src/theme-provider.tsx
          grep -q -- "--pzhown-ui-material-filter" packages/ui/src/components.css
          ! grep -R "className=.*pzhown-ui" packages/ui/src/components apps/web/src/components --include='*.tsx'
          pnpm --filter @pzhown/ui exec tsc -p tsconfig.json --noEmit
          pnpm --filter @pzhown/web check
          pnpm --filter @pzhown/web build
          pnpm --filter @pzhown/cms exec tsc --noEmit --incremental false

      - name: Install Chromium
        run: pnpm dlx playwright@1.55.0 install chromium

      - name: Start preview
        run: |
          pnpm --filter @pzhown/web preview --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/components/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/astro-preview.log
          exit 1

      - name: Browser audit ThemeProvider and iOS material system
        run: |
          cat > ios-theme.spec.js <<'TEST'
          const { test, expect } = require('@playwright/test')

          test('iOS theme is owned by ThemeProvider across components and portals', async ({ page }) => {
            const errors = []
            const failed = []
            page.on('pageerror', (error) => errors.push(error.message))
            page.on('console', (message) => {
              if (message.type() === 'error' || message.type() === 'warning') errors.push(message.text())
            })
            page.on('response', (response) => {
              if (response.status() >= 400) failed.push(`${response.status()} ${response.url()}`)
            })

            await page.goto('http://127.0.0.1:4321/components/', { waitUntil: 'networkidle' })
            await expect(page.locator('[data-component]')).toHaveCount(58)
            await expect(page.locator('[data-demo-error]')).toHaveCount(0)

            const root = page.locator('html')
            await expect(root).toHaveAttribute('data-pzhown-ui', '')
            await expect(root).toHaveAttribute('data-pzhown-theme', 'ios')
            await expect(root).toHaveAttribute('data-theme', 'light')

            const visual = await page.evaluate(() => {
              const rootStyle = getComputedStyle(document.documentElement)
              const button = document.querySelector('[data-component="button"] [data-slot="button"]')
              const card = document.querySelector('[data-slot="card"]')
              const selectedSwitch = document.querySelector('[data-component="switch"] [data-slot="switch"][data-selected]')
              return {
                primary: rootStyle.getPropertyValue('--pzhown-ui-primary').trim(),
                switchOn: rootStyle.getPropertyValue('--pzhown-ui-switch-on').trim(),
                materialFilter: rootStyle.getPropertyValue('--pzhown-ui-material-filter').trim(),
                button: button ? getComputedStyle(button).backgroundColor : null,
                cardShadow: card ? getComputedStyle(card).boxShadow : null,
                switch: selectedSwitch ? getComputedStyle(selectedSwitch).backgroundColor : null,
              }
            })
            console.log('IOS_VISUAL', JSON.stringify(visual))
            expect(visual.primary).toContain('oklch')
            expect(visual.switchOn).toContain('oklch')
            expect(visual.materialFilter).toContain('blur(28px)')
            expect(visual.cardShadow).toBe('none')

            await page.getByRole('button', { name: '切到深色' }).click()
            await expect(root).toHaveAttribute('data-theme', 'dark')
            await expect(root).toHaveClass(/dark/)
            await page.getByRole('button', { name: '切到浅色' }).click()
            await expect(root).toHaveAttribute('data-theme', 'light')

            const alertDialog = page.locator('[data-component="alert-dialog"]')
            await alertDialog.getByRole('button', { name: '打开确认对话框' }).click()
            const dialog = page.locator('[data-slot="alert-dialog-content"]')
            await expect(dialog).toBeVisible()
            const portal = await dialog.evaluate((element) => {
              const s = getComputedStyle(element)
              return {
                supportsBackdrop: CSS.supports('backdrop-filter', 'blur(1px)'),
                background: s.backgroundColor,
                backdrop: s.backdropFilter,
                webkitBackdrop: s.webkitBackdropFilter,
                radius: s.borderRadius,
                shadow: s.boxShadow,
              }
            })
            console.log('IOS_PORTAL', JSON.stringify(portal))
            expect(portal.background).not.toBe('rgba(0, 0, 0, 0)')
            if (portal.supportsBackdrop) expect(portal.backdrop).toContain('blur(28px)')
            expect(portal.radius).toBe('28px')
            expect(portal.shadow).not.toBe('none')

            expect(errors).toEqual([])
            expect(failed).toEqual([])
          })
          TEST
          pnpm dlx @playwright/test@1.55.0 test ios-theme.spec.js --reporter=line --workers=1

      - name: Commit clean implementation
        run: |
          rm -f .github/workflows/ios-theme-provider.yml .github/workflows/ios-theme-provider-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(ui): add iOS ThemeProvider visual system'
          git push origin HEAD:refactor/ios-theme-provider
