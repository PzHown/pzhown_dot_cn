name: Validate all shadcn React Aria components

on:
  push:
    branches:
      - chore/install-all-aria-components

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Add UI-local TypeScript and React declarations
        run: pnpm --filter @pzhown/ui add -D typescript@5.9.2 @types/react@19.2.14 @types/react-dom@19.2.3

      - name: Adapt upstream components to existing local APIs
        run: |
          node <<'NODE'
          const fs = require('fs')

          function patch(path, from, to) {
            let source = fs.readFileSync(path, 'utf8')
            if (!source.includes(from)) {
              throw new Error(`Patch target not found in ${path}: ${from.slice(0, 80)}`)
            }
            source = source.replace(from, to)
            fs.writeFileSync(path, source)
          }

          const command = 'packages/ui/src/components/command.tsx'
          patch(command, '  Dialog,\n  DialogDescription,', '  Dialog,\n  DialogContent,\n  DialogDescription,')
          patch(command, '"children" | "className" | "isOpen" | "onOpenChange"', '"children" | "className" | "open" | "onOpenChange"')
          patch(
            command,
            `  return (\n    <Dialog\n      isOpen={open}\n      onOpenChange={onOpenChange}\n      className={cn(\n        "tw:top-1/3 tw:translate-y-0 tw:overflow-hidden tw:rounded-xl! tw:p-0",\n        className\n      )}\n      showCloseButton={showCloseButton}\n      isDismissable\n      {...props}\n    >\n      <DialogHeader className="tw:sr-only">\n        <DialogTitle>{title}</DialogTitle>\n        <DialogDescription>{description}</DialogDescription>\n      </DialogHeader>\n      {children}\n    </Dialog>\n  )`,
            `  return (\n    <Dialog open={open} onOpenChange={onOpenChange} {...props}>\n      <DialogContent\n        className={cn(\n          "tw:top-1/3 tw:translate-y-0 tw:overflow-hidden tw:rounded-xl! tw:p-0",\n          className\n        )}\n        showCloseButton={showCloseButton}\n        isDismissable\n      >\n        <DialogHeader className="tw:sr-only">\n          <DialogTitle>{title}</DialogTitle>\n          <DialogDescription>{description}</DialogDescription>\n        </DialogHeader>\n        {children}\n      </DialogContent>\n    </Dialog>\n  )`
          )

          const dialog = 'packages/ui/src/components/dialog.tsx'
          patch(
            dialog,
            `}: React.ComponentProps<typeof Button> & { render?: React.ReactElement }) {`,
            `}: Omit<React.ComponentProps<typeof Button>, 'children' | 'render'> & { render?: React.ReactElement; children?: React.ReactNode }) {`
          )

          const dropdown = 'packages/ui/src/components/dropdown-menu.tsx'
          patch(dropdown, `  Header as HeaderPrimitive,`, `  composeRenderProps,\n  Header as HeaderPrimitive,`)
          patch(
            dropdown,
            `    >\n      {children}\n      <ChevronRightIcon className="tw:ml-auto" />\n    </MenuItemPrimitive>`,
            `      children={composeRenderProps(children, (resolvedChildren) => (\n        <>\n          {resolvedChildren}\n          <ChevronRightIcon className="tw:ml-auto" />\n        </>\n      ))}\n    />`
          )
          patch(
            dropdown,
            `    >\n      <span className="tw:pointer-events-none tw:absolute tw:left-2 tw:flex tw:size-4 tw:items-center tw:justify-center">\n        {checked ? <CheckIcon className="tw:size-4" /> : null}\n      </span>\n      {children}\n    </MenuItemPrimitive>`,
            `      children={composeRenderProps(children, (resolvedChildren) => (\n        <>\n          <span className="tw:pointer-events-none tw:absolute tw:left-2 tw:flex tw:size-4 tw:items-center tw:justify-center">\n            {checked ? <CheckIcon className="tw:size-4" /> : null}\n          </span>\n          {resolvedChildren}\n        </>\n      ))}\n    />`
          )
          patch(
            dropdown,
            `    >\n      <span className="tw:pointer-events-none tw:absolute tw:left-2 tw:flex tw:size-4 tw:items-center tw:justify-center">\n        {selected ? <CheckIcon className="tw:size-4" /> : null}\n      </span>\n      {children}\n    </MenuItemPrimitive>`,
            `      children={composeRenderProps(children, (resolvedChildren) => (\n        <>\n          <span className="tw:pointer-events-none tw:absolute tw:left-2 tw:flex tw:size-4 tw:items-center tw:justify-center">\n            {selected ? <CheckIcon className="tw:size-4" /> : null}\n          </span>\n          {resolvedChildren}\n        </>\n      ))}\n    />`
          )

          const tooltip = 'packages/ui/src/components/tooltip.tsx'
          patch(tooltip, `  OverlayArrow,`, `  composeRenderProps,\n  OverlayArrow,`)
          patch(
            tooltip,
            `    >\n      {children}\n      <OverlayArrow className="pzhown-tooltip-arrow">\n        <svg width="8" height="5" viewBox="0 0 8 5" aria-hidden="true">\n          <path d="M0 0 4 5 8 0" />\n        </svg>\n      </OverlayArrow>\n    </TooltipPrimitive>`,
            `      children={composeRenderProps(children, (resolvedChildren) => (\n        <>\n          {resolvedChildren}\n          <OverlayArrow className="pzhown-tooltip-arrow">\n            <svg width="8" height="5" viewBox="0 0 8 5" aria-hidden="true">\n              <path d="M0 0 4 5 8 0" />\n            </svg>\n          </OverlayArrow>\n        </>\n      ))}\n    />`
          )

          const sidebar = 'packages/ui/src/components/sidebar.tsx'
          patch(sidebar, `import { Tooltip, TooltipTrigger } from "@pzhown/ui/components/tooltip"`, `import { Tooltip, TooltipContent, TooltipTrigger } from "@pzhown/ui/components/tooltip"`)
          patch(sidebar, `tooltip?: string | React.ComponentProps<typeof Tooltip>`, `tooltip?: string | React.ComponentProps<typeof TooltipContent>`)
          patch(
            sidebar,
            `  return (\n    <TooltipTrigger isDisabled={state !== "collapsed" || isMobile}>\n      {comp}\n      <Tooltip placement="right" {...tooltip} />\n    </TooltipTrigger>\n  )`,
            `  return (\n    <Tooltip isDisabled={state !== "collapsed" || isMobile}>\n      <TooltipTrigger>{comp}</TooltipTrigger>\n      <TooltipContent placement="right" {...tooltip} />\n    </Tooltip>\n  )`
          )

          const tabs = 'packages/ui/src/components/tabs.tsx'
          let tabsSource = fs.readFileSync(tabs, 'utf8')
          if (!tabsSource.includes('React.Key')) throw new Error('React.Key patch target missing in tabs.tsx')
          tabsSource = tabsSource.replaceAll('React.Key', 'string | number')
          fs.writeFileSync(tabs, tabsSource)
          NODE

      - name: Type-check shared UI
        run: pnpm --filter @pzhown/ui exec tsc -p tsconfig.json --noEmit

      - name: Check Astro application
        run: pnpm --filter @pzhown/web check

      - name: Remove one-off validation workflow
        run: rm -f .github/workflows/validate-all-aria-components.yml

      - name: Commit validated compatibility changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): align generated components with local React Aria APIs'
          git push origin HEAD:chore/install-all-aria-components
