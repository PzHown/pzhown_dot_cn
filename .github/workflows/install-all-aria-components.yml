name: Finish installing all shadcn React Aria components

on:
  push:
    branches:
      - chore/install-all-aria-components

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Resolve available aria-nova registry items
        id: registry
        run: |
          set -euo pipefail
          components=(
            accordion alert alert-dialog aspect-ratio attachment avatar badge breadcrumb bubble button button-group
            calendar card carousel chart checkbox collapsible combobox command context-menu data-table date-picker dialog
            direction drawer dropdown-menu empty field hover-card input input-group input-otp item kbd label marker menubar
            message message-scroller native-select navigation-menu pagination popover progress questionnaire radio-group resizable
            scroll-area select separator sheet sidebar skeleton slider spinner switch table tabs textarea toast toggle toggle-group
            tooltip typography
          )
          available=()
          unavailable=()
          for component in "${components[@]}"; do
            url="https://ui.shadcn.com/r/styles/aria-nova/${component}.json"
            if curl -fsSL -o /dev/null "$url"; then
              available+=("$component")
            else
              unavailable+=("$component")
            fi
          done
          printf '%s\n' "${unavailable[@]}" > /tmp/unavailable-aria-components.txt
          printf 'components=%s\n' "${available[*]}" >> "$GITHUB_OUTPUT"
          echo "Available: ${#available[@]}; unavailable: ${#unavailable[@]}"

      - name: Add every available aria-nova component without overwriting local customizations
        run: |
          read -ra components <<< "${{ steps.registry.outputs.components }}"
          set +o pipefail
          yes n | pnpm dlx shadcn@latest add --yes --cwd packages/ui "${components[@]}"

      - name: Rebuild component barrel
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const dir = path.join(process.cwd(), 'packages/ui/src/components')
          const files = fs.readdirSync(dir)
            .filter((name) => name.endsWith('.tsx'))
            .map((name) => name.slice(0, -4))
            .sort((a, b) => a.localeCompare(b))
          fs.writeFileSync(
            path.join(dir, 'index.ts'),
            files.map((name) => `export * from './${name}'\n`).join(''),
          )
          NODE

      - name: Update upstream availability note
        run: |
          {
            echo '# shadcn aria-nova upstream availability'
            echo
            echo 'Generated from the shadcn component catalog on 2026-08-28.'
            echo 'All registry entries that currently exist for aria-nova are installed locally.'
            echo
            echo 'The following catalog entries did not have an aria-nova registry item at generation time:'
            echo
            while IFS= read -r component; do
              [ -n "$component" ] && echo "- \`$component\`"
            done < /tmp/unavailable-aria-components.txt
          } > packages/ui/UPSTREAM_COMPONENTS.md

      - name: Remove one-off workflow
        run: rm -f .github/workflows/install-all-aria-components.yml

      - name: Commit generated components
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ui): finish installing all available React Aria components'
          git push origin HEAD:chore/install-all-aria-components
