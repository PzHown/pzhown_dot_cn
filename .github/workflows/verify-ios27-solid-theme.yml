name: Verify solid iOS 26 27 theme

on:
  push:
    branches:
      - refactor/ios-theme-provider

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Connect component document theme toggle to ThemeProvider
        run: |
          node <<'NODE'
          const fs = require('fs')
          const file = 'apps/web/src/components/component-document/ComponentsDocument.tsx'
          let source = fs.readFileSync(file, 'utf8')
          source = source.replace(
            "import * as React from 'react'\n",
            "import * as React from 'react'\nimport { useTheme } from '@pzhown/ui/react'\n",
          )
          source = source.replace(
            "  const [query, setQuery] = React.useState('')\n  const [dark, setDark] = React.useState(false)",
            "  const [query, setQuery] = React.useState('')\n  const { resolvedMode, setMode } = useTheme()\n  const dark = resolvedMode === 'dark'",
          )
          source = source.replace(
            "    <div className=\"component-document pzhown-ui tw:min-h-screen tw:bg-background tw:text-foreground\" data-theme={dark ? 'dark' : 'light'}>",
            "    <div className=\"component-document pzhown-ui tw:min-h-screen tw:bg-background tw:text-foreground\">",
          )
          source = source.replace(
            "onClick={() => setDark((value) => !value)}",
            "onClick={() => setMode(dark ? 'light' : 'dark')}",
          )
          fs.writeFileSync(file, source)
          NODE

      - name: Remove Liquid Glass styling from the UI Lab shell
        run: |
          node <<'NODE'
          const fs = require('fs')
          const file = 'apps/web/src/pages/index.astro'
          let source = fs.readFileSync(file, 'utf8')
          source = source.replace(
            'Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;',
            '-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;',
          )
          source = source.replace(
            '    background: rgb(255 255 255 / 0.68);\n    box-shadow: 0 30px 100px rgb(17 24 39 / 0.06);\n    backdrop-filter: blur(24px);\n    -webkit-backdrop-filter: blur(24px);',
            '    background: rgb(255 255 255 / 0.96);\n    box-shadow: 0 18px 60px rgb(17 24 39 / 0.045);',
          )
          source = source.replace(
            '    background: rgb(255 255 255 / 0.48);\n    color: rgb(18 19 22 / 0.62);',
            '    background: rgb(255 255 255 / 0.92);\n    color: rgb(18 19 22 / 0.62);',
          )
          source = source.replace('    backdrop-filter: blur(12px);\n', '')
          fs.writeFileSync(file, source)
          NODE

      - name: Typecheck and build
        run: |
          pnpm --filter @pzhown/ui exec tsc -p tsconfig.json --noEmit
          pnpm --filter @pzhown/web check
          pnpm --filter @pzhown/web build
          pnpm --filter @pzhown/cms exec tsc --noEmit --incremental false

      - name: Install Chromium
        run: pnpm dlx playwright@1.55.0 install chromium

      - name: Start preview
        run: |
          pnpm --filter @pzhown/web preview --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/components/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/astro-preview.log
          exit 1

      - name: Browser audit solid iOS theme
        run: |
          cat > ios27-solid.spec.js <<'TEST'
          const { test, expect } = require('@playwright/test')

          test('iOS 26/27 theme is solid, round, and provider-owned', async ({ page }) => {
            const pageErrors = []
            page.on('pageerror', error => pageErrors.push(error.message))

            await page.goto('http://127.0.0.1:4321/components/', { waitUntil: 'networkidle' })
            await expect(page.locator('[data-component]')).toHaveCount(58)
            await expect(page.locator('[data-demo-error]')).toHaveCount(0)

            const root = page.locator('html')
            await expect(root).toHaveAttribute('data-pzhown-theme', 'ios27')
            await expect(root).toHaveAttribute('data-theme', 'light')

            const base = await page.evaluate(() => {
              const rootStyle = getComputedStyle(document.documentElement)
              const card = document.querySelector('[data-slot="card"]')
              const selectedSwitch = document.querySelector('[data-component="switch"] [data-slot="switch"][data-selected]')
              return {
                primary: rootStyle.getPropertyValue('--pzhown-ui-primary').trim(),
                radiusSurface: rootStyle.getPropertyValue('--pzhown-ui-radius-surface').trim(),
                switchOn: rootStyle.getPropertyValue('--pzhown-ui-switch-on').trim(),
                cardShadow: card ? getComputedStyle(card).boxShadow : null,
                switchBackground: selectedSwitch ? getComputedStyle(selectedSwitch).backgroundColor : null,
              }
            })
            console.log('IOS27_SOLID', JSON.stringify(base))
            expect(base.primary).toContain('oklch')
            expect(base.radiusSurface).toBe('22px')
            expect(base.switchOn).toContain('oklch')
            expect(base.cardShadow).toBe('none')

            await page.getByRole('button', { name: '切到深色' }).click()
            await expect(root).toHaveAttribute('data-theme', 'dark')
            await expect(root).toHaveClass(/dark/)

            const alertSection = page.locator('[data-component="alert-dialog"]')
            await alertSection.getByRole('button', { name: '打开确认对话框' }).click()
            const dialog = page.locator('[data-slot="alert-dialog-content"]')
            await expect(dialog).toBeVisible()
            const floating = await dialog.evaluate(element => {
              const style = getComputedStyle(element)
              return {
                background: style.backgroundColor,
                backdrop: style.backdropFilter,
                radius: style.borderRadius,
                shadow: style.boxShadow,
              }
            })
            console.log('IOS27_FLOATING', JSON.stringify(floating))
            expect(floating.background).not.toBe('rgba(0, 0, 0, 0)')
            expect(floating.backdrop).toBe('none')
            expect(floating.radius).toBe('30px')
            expect(floating.shadow).not.toBe('none')
            expect(pageErrors).toEqual([])
          })
          TEST
          pnpm dlx @playwright/test@1.55.0 test ios27-solid.spec.js --reporter=line --workers=1

      - name: Commit verified implementation
        run: |
          rm -f .github/workflows/verify-ios27-solid-theme.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(ui): adopt solid iOS 26 27 visual language'
          git push origin HEAD:refactor/ios-theme-provider
