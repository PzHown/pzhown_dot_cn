name: Remove squircle system

on:
  push:
    branches:
      - fix/remove-squircle

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove superellipse implementation and references
        run: |
          node <<'NODE'
          const fs = require('fs')

          function load(path) {
            return fs.readFileSync(path, 'utf8')
          }

          function save(path, source) {
            fs.writeFileSync(path, source)
          }

          function replaceAll(path, pairs) {
            let source = load(path)
            for (const [from, to] of pairs) {
              if (!source.includes(from)) throw new Error(`Target not found in ${path}: ${from.slice(0, 100)}`)
              source = source.split(from).join(to)
            }
            save(path, source)
          }

          replaceAll('packages/ui/src/effects.css', [[
            `/* Global squircle corners with graceful border-radius fallback. */\n@supports (corner-shape: squircle) {\n  *,\n  *::before,\n  *::after {\n    corner-shape: squircle;\n  }\n}\n\n`,
            ``
          ]])

          replaceAll('README.md', [
            [
              `### Squircle corners\n\n\`@pzhown/ui/effects.css\` globally applies \`corner-shape: squircle\` wherever the browser supports it. Existing \`border-radius\` values remain the source of corner size. Browsers without \`corner-shape\` support simply keep the normal rounded-corner rendering.\n\n\`\`\`css\n.card {\n  border-radius: 24px;\n}\n\`\`\`\n\nNo extra class is required for the squircle shape.\n\n`,
              `### Rounded corners\n\nShared UI uses normal CSS \`border-radius\` values directly. Corner size remains explicit at the component or token layer.\n\n\`\`\`css\n.card {\n  border-radius: 24px;\n}\n\`\`\`\n\n`
            ],
            [`The PzHown layer owns squircle corners, translucent surfaces, OKLCH tokens, blur, gradients, and interaction styling.`, `The PzHown layer owns rounded surfaces, translucent materials, OKLCH tokens, blur, gradients, and interaction styling.`],
          ])

          replaceAll('AGENTS.md', [
            [`  - Apple-inspired 视觉语言、Squircle、色彩、Neutral、材质、阴影、透明与 Blur。`, `  - Apple-inspired 视觉语言、色彩、Neutral、圆角、材质、阴影、透明与 Blur。`],
            [`- 圆角优先使用全局 \`corner-shape: squircle\`。`, `- 圆角使用组件既有 \`border-radius\` / radius token；不要引入额外的全局角形状规则。`],
          ])

          replaceAll('HUMAN.md', [[
            `- \`packages/ui\`：React Aria、Motion、Squircle、Progressive Blur、颜色 Token 等共享 UI 能力。`,
            `- \`packages/ui\`：React Aria、Motion、标准圆角、Progressive Blur、颜色 Token 等共享 UI 能力。`
          ]])

          replaceAll('DESIGN.md', [
            [`负责最终视觉语言：材质、色彩、Neutral、Squircle、阴影、透明度和 Apple-inspired 的克制感。它不重新定义空间、导航、认知、交互或系统状态语义。`, `负责最终视觉语言：材质、色彩、Neutral、圆角、阴影、透明度和 Apple-inspired 的克制感。它不重新定义空间、导航、认知、交互或系统状态语义。`],
            [`- 圆角优先使用现有 \`corner-shape: squircle\` 体系。`, `- 圆角使用组件既有 \`border-radius\` 与 radius token，不叠加额外的全局角形状规则。`],
            [`- Squircle、Smooth Gradient、Progressive Blur 是工具，不是必须装饰。`, `- Smooth Gradient、Progressive Blur 是工具，不是必须装饰。`],
          ])

          replaceAll('.agents/skills/apple-design/SKILL.md', [
            [`用于色彩、灰度与 Neutral、材质、层级、Squircle、阴影、透明度、Glass、Progressive Blur、视觉组件外观、品牌气质和视觉审查`, `用于色彩、灰度与 Neutral、材质、层级、圆角、阴影、透明度、Glass、Progressive Blur、视觉组件外观、品牌气质和视觉审查`],
            [`1. 检查 \`DESIGN.md\` 和现有 \`@pzhown/ui\`，优先复用现有 token、Squircle、Smooth Gradient、Progressive Blur。`, `1. 检查 \`DESIGN.md\` 和现有 \`@pzhown/ui\`，优先复用现有 token、radius、Smooth Gradient、Progressive Blur。`],
            [`- 已设置 \`border-radius\` 的界面优先通过全局 \`corner-shape: squircle\` 获得连续圆角；不要另造 SVG 圆角方案，除非明确需要严格曲率。`, `- 圆角直接使用组件或 token 中已有的 \`border-radius\`；保持 radius 层级一致，不再叠加另一套全局角形状系统。`],
            [`- Squircle、radius、spacing、surface 和颜色是否来自统一体系？`, `- radius、spacing、surface 和颜色是否来自统一体系？`],
          ])

          replaceAll('.agents/skills/apple-design/HUMAN.md', [
            [`这个 Skill 负责项目最终的视觉语言：层级、Neutral 灰度、颜色、材质、Squircle、阴影、透明度、Glass 和 Progressive Blur。`, `这个 Skill 负责项目最终的视觉语言：层级、Neutral 灰度、颜色、材质、圆角、阴影、透明度、Glass 和 Progressive Blur。`],
            [`当任务涉及颜色、灰度、Surface、Squircle、边框、阴影、Glass、Blur、视觉层级、品牌气质、暗色模式和组件外观时，看这里。`, `当任务涉及颜色、灰度、Surface、圆角、边框、阴影、Glass、Blur、视觉层级、品牌气质、暗色模式和组件外观时，看这里。`],
            [`- \`corner-shape: squircle\` 的连续圆角体系。`, `- 基于 \`border-radius\` / radius token 的统一圆角体系。`],
          ])

          replaceAll('.agents/skills/apple-design/references/visual-language.md', [[
            `- 默认使用 CSS \`border-radius\` 定尺寸，并由全局 \`corner-shape: squircle\` 在支持浏览器中升级为超椭圆。`,
            `- 默认直接使用 CSS \`border-radius\` 定尺寸，并通过统一 radius 层级保持组件之间的形状关系。`
          ]])

          replaceAll('.agents/skills/apple-design/references/web-implementation.md', [
            [`- \`effects.css\`：Squircle、Smooth Gradient 等全局视觉能力。`, `- \`effects.css\`：Smooth Gradient 等共享视觉能力。`],
            [
              `## Squircle\n\n正常设置 radius：\n\n\`\`\`css\n.card {\n  border-radius: 24px;\n}\n\`\`\`\n\n由共享样式在浏览器支持时应用：\n\n\`\`\`css\n@supports (corner-shape: squircle) {\n  *, *::before, *::after {\n    corner-shape: squircle;\n  }\n}\n\`\`\`\n\n不要为普通圆角加入 SVG mask 或复杂 Bézier。`,
              `## 圆角\n\n直接使用标准 radius：\n\n\`\`\`css\n.card {\n  border-radius: 24px;\n}\n\`\`\`\n\n优先从共享 radius token 或组件既有层级选择值。不要为普通圆角加入 SVG mask、复杂 Bézier 或额外的全局曲率覆盖。`
            ],
          ])

          replaceAll('.agents/skills/interaction-affordance/SKILL.md', [[`- 颜色、Squircle、Surface、材质：使用 \`apple-design\`。`, `- 颜色、圆角、Surface、材质：使用 \`apple-design\`。`]])
          replaceAll('.agents/skills/interaction-affordance/HUMAN.md', [[`- 颜色、Squircle 和 Surface 最终长相：看[Apple 视觉](../apple-design/HUMAN.md)。`, `- 颜色、圆角和 Surface 最终长相：看[Apple 视觉](../apple-design/HUMAN.md)。`]])
          replaceAll('.agents/skills/spatial-composition/SKILL.md', [[`- Neutral、颜色、Squircle、Glass、Blur、Shadow：使用 \`apple-design\`。`, `- Neutral、颜色、圆角、Glass、Blur、Shadow：使用 \`apple-design\`。`]])
          replaceAll('.agents/skills/spatial-composition/HUMAN.md', [[`- 颜色、材质、Squircle、Glass、Blur：看[Apple 视觉](../apple-design/HUMAN.md)。`, `- 颜色、材质、圆角、Glass、Blur：看[Apple 视觉](../apple-design/HUMAN.md)。`]])
          replaceAll('.agents/skills/perceptual-reading/HUMAN.md', [[`- 最终颜色、材质、Squircle：看[Apple 视觉](../apple-design/HUMAN.md)。`, `- 最终颜色、材质、圆角：看[Apple 视觉](../apple-design/HUMAN.md)。`]])
          replaceAll('.agents/skills/perceptual-naturalness/HUMAN.md', [[`- 最终颜色、材质、Squircle 和 Shadow 风格：看[Apple 视觉](../apple-design/HUMAN.md)。`, `- 最终颜色、材质、圆角和 Shadow 风格：看[Apple 视觉](../apple-design/HUMAN.md)。`]])
          replaceAll('.agents/skills/perceptual-naturalness/references/material-light-depth.md', [[`- 连续曲率、Squircle、圆形等形状会影响高光和阴影的视觉解释。`, `- 连续曲率、圆角、圆形等形状会影响高光和阴影的视觉解释。`]])

          replaceAll('apps/web/src/components/ComponentShowcase.tsx', [
            [`React Aria owns adaptive interaction and accessibility; PzHown UI owns squircle, blur, surfaces and motion language.`, `React Aria owns adaptive interaction and accessibility; PzHown UI owns rounded surfaces, blur and motion language.`],
            [`React Aria positioning with a translucent squircle surface and soft entrance motion.`, `React Aria positioning with a translucent rounded surface and soft entrance motion.`],
            [`Squircle corners, Oklab color interpolation and progressive blur form the visual foundation.`, `Rounded surfaces, Oklab color interpolation and progressive blur form the visual foundation.`],
          ])

          replaceAll('apps/web/src/pages/index.astro', [
            [`Squircle corners, perceptual gradients, progressive blur, Motion, and React Aria components — all in one preview surface.`, `Rounded surfaces, perceptual gradients, progressive blur, Motion, and React Aria components — all in one preview surface.`],
            [`<h2>Squircle</h2>`, `<h2>Rounded corners</h2>`],
            [`<p>\`corner-shape: squircle\` globally upgrades every existing border radius where the browser supports it.</p>`, `<p>Standard CSS border radius keeps corner geometry explicit and consistent across supported browsers.</p>`],
            [`squircle-grid`, `radius-grid`],
            [`squircle-demo`, `radius-demo`],
            [`Adaptive interaction primitives run as one React island while PzHown UI owns the visual language, squircle surfaces and Motion integration.`, `Adaptive interaction primitives run as one React island while PzHown UI owns the visual language, rounded surfaces and Motion integration.`],
          ])

          fs.rmSync('.github/workflows/remove-squircle.yml')
          NODE

          if git grep -niE 'squircle|corner-shape|超椭圆' -- .; then
            echo 'Forbidden superellipse references remain.'
            exit 1
          fi

      - name: Check shared UI
        run: pnpm --filter @pzhown/ui exec tsc -p tsconfig.json --noEmit

      - name: Check Astro
        run: pnpm --filter @pzhown/web check

      - name: Build Astro
        run: pnpm --filter @pzhown/web build

      - name: Commit removal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(ui): remove superellipse corner system'
          git push origin HEAD:fix/remove-squircle
