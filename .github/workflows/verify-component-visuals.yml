name: Fix and verify portaled component visuals

on:
  push:
    branches:
      - refactor/skill-component-visuals

permissions:
  contents: write

jobs:
  browser:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scope portaled surfaces and clean generated files
        run: |
          node <<'NODE'
          const fs = require('fs')

          function replace(path, from, to) {
            let source = fs.readFileSync(path, 'utf8')
            if (!source.includes(from)) throw new Error(`Patch target not found in ${path}`)
            source = source.replace(from, to)
            fs.writeFileSync(path, source)
          }

          replace('packages/ui/src/components/alert-dialog.tsx',
            '"tw:fixed tw:inset-0 tw:isolate tw:z-50',
            '"pzhown-ui tw:fixed tw:inset-0 tw:isolate tw:z-50')

          replace('packages/ui/src/components/sheet.tsx',
            '"tw:fixed tw:inset-0 tw:z-50 tw:bg-black/10',
            '"pzhown-ui tw:fixed tw:inset-0 tw:z-50 tw:bg-black/10')

          replace('packages/ui/src/components/drawer.tsx',
            '"tw:fixed tw:inset-0 tw:z-50 tw:min-h-dvh',
            '"pzhown-ui tw:fixed tw:inset-0 tw:z-50 tw:min-h-dvh')
          replace('packages/ui/src/components/drawer.tsx',
            '"tw:group/drawer-popup tw:pointer-events-auto',
            '"pzhown-ui tw:group/drawer-popup tw:pointer-events-auto')

          replace('packages/ui/src/components/select.tsx',
            'cn("tw: tw: tw:relative tw:isolate tw:z-50',
            'cn("pzhown-ui tw:relative tw:isolate tw:z-50')

          replace('packages/ui/src/components/combobox.tsx',
            'cn("tw: tw: tw:relative tw:isolate tw:z-50',
            'cn("pzhown-ui tw:relative tw:isolate tw:z-50')

          replace('packages/ui/src/components/context-menu.tsx',
            'cn("tw: tw: tw:z-50 tw:w-(--trigger-width)',
            'cn("pzhown-ui tw:z-50 tw:w-(--trigger-width)')

          replace('packages/ui/src/components/hover-card.tsx',
            '"tw:z-50 tw:w-64',
            '"pzhown-ui tw:z-50 tw:w-64')

          const gitignore = '.gitignore'
          let ignore = fs.readFileSync(gitignore, 'utf8')
          if (!ignore.includes('*.tsbuildinfo')) {
            ignore = ignore.trimEnd() + '\n\n# TypeScript incremental build metadata\n*.tsbuildinfo\n'
            fs.writeFileSync(gitignore, ignore)
          }

          if (fs.existsSync('apps/cms/tsconfig.tsbuildinfo')) fs.rmSync('apps/cms/tsconfig.tsbuildinfo')
          NODE

      - name: Check shared UI
        run: pnpm --filter @pzhown/ui exec tsc -p tsconfig.json --noEmit

      - name: Check Astro
        run: pnpm --filter @pzhown/web check

      - name: Build Astro
        run: pnpm --filter @pzhown/web build

      - name: Check CMS without build metadata
        run: pnpm --filter @pzhown/cms exec tsc --noEmit --incremental false

      - name: Install Chromium
        run: pnpm dlx playwright@1.55.0 install chromium

      - name: Start preview
        run: |
          pnpm --filter @pzhown/web preview --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/components/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/astro-preview.log
          exit 1

      - name: Browser visual and runtime audit
        run: |
          cat > component-visuals.spec.js <<'TEST'
          const { test, expect } = require('@playwright/test')

          test('shared visual system survives portals, themes and hydration', async ({ page }) => {
            const messages = []
            const failedResponses = []
            page.on('pageerror', (error) => messages.push(`pageerror: ${error.message}`))
            page.on('console', (message) => {
              if (message.type() === 'error' || message.type() === 'warning') messages.push(`${message.type()}: ${message.text()}`)
            })
            page.on('response', (response) => {
              if (response.status() >= 400) failedResponses.push(`${response.status()} ${response.url()}`)
            })

            await page.goto('http://127.0.0.1:4321/components/', { waitUntil: 'networkidle' })
            await expect(page.locator('[data-component]')).toHaveCount(58)
            await expect(page.locator('[data-demo-error]')).toHaveCount(0)

            const styles = await page.evaluate(() => {
              const read = (slot) => {
                const el = document.querySelector(`[data-slot="${slot}"]`)
                if (!el) return null
                const s = getComputedStyle(el)
                return { slot, background: s.backgroundColor, radius: s.borderRadius, shadow: s.boxShadow, backdrop: s.backdropFilter }
              }
              return ['button', 'input', 'card', 'alert', 'badge', 'tabs-list', 'switch', 'table-row', 'skeleton', 'breadcrumb-separator'].map(read)
            })
            console.log('LIGHT_STYLES', JSON.stringify(styles))
            expect(styles.find((x) => x?.slot === 'card')?.shadow).toBe('none')
            expect(styles.find((x) => x?.slot === 'input')?.backdrop).toBe('none')
            expect(styles.find((x) => x?.slot === 'breadcrumb-separator')?.background).toBe('rgba(0, 0, 0, 0)')

            await page.getByRole('button', { name: '切到深色' }).click()
            await expect(page.locator('.component-document')).toHaveAttribute('data-theme', 'dark')
            await page.waitForTimeout(300)
            const darkCard = await page.locator('[data-slot="card"]').first().evaluate((el) => getComputedStyle(el).backgroundColor)
            console.log('DARK_CARD', darkCard)
            await page.getByRole('button', { name: '切到浅色' }).click()
            await page.waitForTimeout(300)

            const alertDialog = page.locator('[data-component="alert-dialog"]')
            await alertDialog.getByRole('button', { name: '打开确认对话框' }).click()
            const dialog = page.locator('[data-slot="alert-dialog-content"]')
            const dialogOverlay = page.locator('[data-slot="alert-dialog-overlay"]')
            await expect(dialog).toBeVisible()
            const dialogStyle = await dialog.evaluate((el) => {
              const s = getComputedStyle(el)
              return { background: s.backgroundColor, radius: s.borderRadius, shadow: s.boxShadow, backdrop: s.backdropFilter }
            })
            const overlayStyle = await dialogOverlay.evaluate((el) => {
              const s = getComputedStyle(el)
              return { className: el.className, background: s.backgroundColor, backdrop: s.backdropFilter }
            })
            console.log('ALERT_DIALOG_STYLE', JSON.stringify(dialogStyle))
            console.log('ALERT_DIALOG_OVERLAY_STYLE', JSON.stringify(overlayStyle))
            expect(overlayStyle.className).toContain('pzhown-ui')
            expect(overlayStyle.background).not.toBe('rgba(0, 0, 0, 0)')
            expect(dialogStyle.background).not.toBe('rgba(0, 0, 0, 0)')
            expect(dialogStyle.radius).toBe('24px')
            expect(dialogStyle.shadow).not.toBe('none')
            await page.keyboard.press('Escape')

            const selectCard = page.locator('[data-component="select"]')
            await selectCard.locator('[data-slot="select-trigger"]').first().click()
            const selectContent = page.locator('[data-slot="select-content"]')
            await expect(selectContent).toBeVisible()
            const selectStyle = await selectContent.evaluate((el) => {
              const s = getComputedStyle(el)
              return { className: el.className, background: s.backgroundColor, radius: s.borderRadius, shadow: s.boxShadow, backdrop: s.backdropFilter }
            })
            console.log('SELECT_STYLE', JSON.stringify(selectStyle))
            expect(selectStyle.className).toContain('pzhown-ui')
            expect(selectStyle.background).not.toBe('rgba(0, 0, 0, 0)')
            expect(selectStyle.radius).toBe('16px')
            expect(selectStyle.shadow).not.toBe('none')
            await page.keyboard.press('Escape')

            console.log('BROWSER_MESSAGES', JSON.stringify(messages))
            console.log('FAILED_RESPONSES', JSON.stringify(failedResponses))
            expect(messages).toEqual([])
            expect(failedResponses).toEqual([])
          })
          TEST

          pnpm dlx @playwright/test@1.55.0 test component-visuals.spec.js --reporter=line --workers=1

      - name: Remove temporary workflow and commit clean result
        run: |
          rm .github/workflows/verify-component-visuals.yml
          rm -f component-visuals.spec.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): preserve visual scope across portals'
          git push origin HEAD:refactor/skill-component-visuals
